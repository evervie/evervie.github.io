<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>evervie — graphic & digital designer</title>
<meta name="description" content="Portfolio of evervie, graphic and digital designer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glow" id="glow" aria-hidden="true"></div>

<header class="nav">
  <a class="logo" href="#top" id="logo"></a>
  <nav><a href="#projects">projects</a><a href="#about">about</a><a href="#contact">contact</a></nav>
  <button class="theme" id="theme" aria-label="Switch light / dark theme"></button>
</header>

<main id="top">
  <section class="hero">
    <div class="orb" aria-hidden="true"><i></i><i></i><i></i></div>
    <span class="pill" id="role"></span>
    <h1 id="headline"></h1>
    <p class="lead" id="intro"></p>
    <a class="go" href="#projects" aria-label="See projects"><svg viewBox="0 0 40 12"><path d="M0 6h38M33 1l5 5-5 5" fill="none" stroke="currentColor"/></svg></a>
  </section>

  <section id="projects" class="sec">
    <h2>selected <em>projects</em></h2>
    <div class="grid" id="grid"></div>
  </section>

  <section id="about" class="sec about">
    <div class="photo" id="photo"></div>
    <div>
      <h2>about <span>me.</span></h2>
      <p id="aboutText"></p>
      <a class="btn" id="resume" hidden>download resume</a>
    </div>
    <div class="skills">
      <h3>skills</h3><ul id="skills"></ul>
      <h3>tools</h3><div class="chips" id="tools"></div>
    </div>
  </section>

  <section id="contact" class="sec contact">
    <h2 id="cta"></h2>
    <a class="btn" id="mail">contact me</a>
    <ul class="social" id="social"></ul>
  </section>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Project" hidden>
  <div class="m-top"><button class="m-back" id="mBack">← back to projects</button></div>
  <div class="m-body" id="mBody"></div>
  <div class="m-foot">
    <span id="mCount"></span>
    <div><button id="mPrev" aria-label="Previous project">←</button><button id="mNext" aria-label="Next project">→</button></div>
    <a class="btn" id="mLink" target="_blank" rel="noopener" hidden>view website ↗</a>
  </div>
</div>

<script src="projects.js"></script>
<script src="script.js"></script>
</body>
</html>
