<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>evervie — graphic & digital designer</title>
<meta name="description" content="Portfolio of evervie, graphic and digital designer.">
<meta name="theme-color" content="#050506">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✧</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,200;0,300;0,400;1,300&family=Jost:wght@200;300&family=Playfair+Display:ital,wght@1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash"><div class="sp-in"><div class="sp-txt"><h2 id="spHello"></h2><canvas id="spStar" aria-hidden="true"></canvas><i class="gstar" aria-hidden="true"></i></div></div></div>
<canvas id="bg3d" aria-hidden="true"></canvas>
<canvas id="mini" aria-hidden="true"></canvas>
<canvas id="sigil" aria-hidden="true"></canvas>

<header class="nav">
  <a class="logo" href="#top" id="logo"></a>
  <nav><a href="#projects" data-i="nav_projects"></a><a href="#about" data-i="nav_about"></a><a href="#contact" data-i="nav_contact"></a></nav>
  <div class="tools">
    <span class="soc" id="topSoc"></span>
    <button class="lang" id="lang"><span data-l="en">EN</span> / <span data-l="ru">RU</span></button>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="orb" aria-hidden="true"><i></i><i></i><i></i></div>
    <span class="pill" id="role"></span>
    <h1 class="pf" aria-label="Portfolio"><span class="en" id="pfEn" aria-hidden="true"></span><canvas id="pf3d" aria-hidden="true"></canvas></h1>
    <div class="hero-meta"><span class="hchip" data-i="hm1"></span><span class="hchip" data-i="hm2"></span><a class="btn hgo" href="#projects"><span data-i="hbtn"></span><i aria-hidden="true">→</i></a></div>
    <a class="scrolly" href="#projects"><span class="mouse" aria-hidden="true"><i></i></span><span class="sl" data-i="scroll"></span></a>
  </section>

  <section id="projects" class="sec proj">
    <div class="p-head">
      <div><h2 class="rv" data-i="h_projects"></h2><p class="eyebrow rv"><i></i><span data-i="p_eyebrow"></span></p><p class="p-sub rv" data-i="p_sub"></p></div>
      <div class="filters rv" id="filters"></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <section id="about" class="sec about">
    <div id="waves" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="a4"></i><b class="frost"></b></div>
    <div class="photo rv" id="photo"></div>
    <div class="glass pad rv a-main">
      <h2 data-i="h_about"></h2>
      <div class="a-cv"><a class="btn" id="resume" data-i="resume"></a><small id="resumeNote"></small></div>
    </div>
    <div class="skills pad rv a-skills">
      <h3 data-i="skills"></h3><ul id="skills"></ul>
      <h3 data-i="tools"></h3><div class="chips" id="tools"></div>
    </div>
    <div class="glass pad rv a-proc"><h3 data-i="h_process"></h3><ol class="steps" id="steps"></ol></div>
    <aside class="glass pad rv a-hist"><h3 data-i="h_story"></h3><ol class="tl" id="story"></ol></aside>
  </section>

  <section id="contact" class="sec contact">
    <div class="glass pad c-box rv">
      <h2 id="cta"></h2>
      <a class="btn" id="mail" data-i="mail"></a>
      <div class="ico-row" id="socIcons"></div>
    </div>
    <canvas id="garden" aria-hidden="true"></canvas>
  </section>
</main>
<footer class="foot" id="foot"></footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" hidden>
  <canvas id="gardenM" aria-hidden="true"></canvas>
  <div class="m-top"><button class="m-back" id="mBack" data-i="back"></button></div>
  <div class="m-body" id="mBody"></div>
  <div class="m-foot">
    <span id="mCount"></span>
    <div><button id="mPrev">←</button><button id="mNext">→</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="projects.js"></script>
<script src="script.js"></script>
<script src="flower.js"></script>
<script src="glass.js"></script>
</body>
</html>
